<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRUCIAL FOR RESPONSIVENESS: Tells the browser to use the device width and prevent unwanted scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nann Emulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Retro Game Boy Color Palette */
        :root {
            --screen-color: #9bbc0f; /* Iconic pea-green background (Confirmed Green) */
            --screen-shadow: #0f380f; /* Darker green for shadows/text */
        }

        body {
            font-family: 'Inter', sans-serif;
            /* FIX: Explicitly remove default browser margins and padding */
            margin: 0; 
            padding: 0;
            
            /* Updated background to a slightly darker gray/blue-gray (#cbd5e1 - Tailwind slate-300) */
            background-color: #cbd5e1;
            
            /* MANDATORY FOR FULL SCREEN FIT: Sets body to use 100% of viewport height/width */
            overflow: hidden; /* CRITICAL: Prevents scrollbars from appearing */
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Prevent iOS rubber banding and allow touch to control the app */
            overscroll-behavior: none; 
            touch-action: none;
        }

        /* Container for scaling - this is the element the JS scales */
        #console-wrapper {
            transform-origin: center center;
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        /* The Game Boy Color Body - Base dimensions adjusted for taller mobile screens */
        .gbc-body {
            /* Updated body color to a soft, slightly off-white (#f8fafc - Tailwind slate-50) */
            background-color: #f8fafc;
            width: 440px; 
            height: 760px; /* Increased height to better match mobile aspect ratios */
            border-radius: 15px 15px 70px 15px;
            
            /* Enhanced realism for the plastic shell texture and 3D bevel */
            box-shadow: 
                /* Outer shadow for lifting the console */
                -15px 15px 40px rgba(0,0,0,0.25),
                /* Top-left light source highlight for a pronounced bevel */
                inset 10px 10px 25px rgba(255,255,255,0.95),
                /* Bottom-right darker shadow for depth and roundness */
                inset -8px -8px 20px rgba(0,0,0,0.15),
                /* Subtle inner top-left light to define edge */
                inset 1px 1px 0px rgba(255,255,255,0.7);
            
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        /* The Screen Bezel */
        .gbc-screen-lens {
            /* Darker bezel color */
            background-color: #3f3f46; /* Tailwind zinc-700 */
            width: 380px;
            height: 300px;
            border-radius: 15px 15px 45px 15px;
            padding: 20px 30px;
            /* Stronger, deeper inset for the lens cavity */
            box-shadow: inset 0px 0px 20px rgba(0,0,0,0.9),
                        inset 2px 2px 5px rgba(0,0,0,0.6); /* Additional subtle top-left dark inset */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .lens-branding {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .power-led {
            width: 10px;
            height: 10px;
            background-color: #1c1c1c; /* Darker off state */
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.7);
            transition: background-color 0.2s;
        }
        .power-led.on {
            /* Changed LED to red/orange matching GBC */
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333, inset 0 0 5px rgba(255, 255, 255, 0.7);
        }

        .lcd-screen {
            /* RETRO SCREEN STYLING */
            background-color: var(--screen-color); /* Pea Green Screen */
            width: 320px;
            height: 240px;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; 
            
            /* Add Scanlines/Texture Overlay */
            &::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                /* Light grid pattern for subtle pixel effect */
                background: 
                    repeating-linear-gradient(to bottom, 
                        rgba(0,0,0,0.1) 0px, 
                        rgba(0,0,0,0.1) 1px, 
                        transparent 1px, 
                        transparent 2px
                    ),
                    /* Vertical Lines for a finer grid (subtle) */
                    repeating-linear-gradient(to right, 
                        rgba(0,0,0,0.05) 0px, 
                        rgba(0,0,0,0.05) 1px, 
                        transparent 1px, 
                        transparent 2px
                    );
                pointer-events: none; /* Allows clicks to pass through */
                z-index: 5;
            }
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Make iframe background transparent so the pea-green color shows through */
            background-color: transparent; 
        }

        .nann-brand {
            font-family: 'Inter', sans-serif;
            font-style: italic;
            font-weight: 900;
            /* Purple/Violet */
            color: #7c3aed; 
            font-size: 28px;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .controls-area {
            width: 100%;
            flex-grow: 1;
            position: relative;
        }

        /* --- D-Pad Styles --- */
        .dpad {
            position: absolute;
            top: 70px; 
            left: 40px;
            width: 120px;
            height: 120px;
        }
        .dpad-cross {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .dpad-arm {
            background-color: #1c1c1c; 
            position: absolute;
            border-radius: 6px;
            box-shadow: 
                inset 2px 2px 4px rgba(255,255,255,0.3), 
                inset -2px -2px 4px rgba(0,0,0,0.4),    
                0 6px 0 #000;                          
            transition: transform 0.1s, box-shadow 0.1s; 
            will-change: transform, box-shadow; 
        }
        .dpad-arm.pressed-arm {
            transform: translateY(2px) !important;
            box-shadow: 
                inset 2px 2px 4px rgba(255,255,255,0.3), 
                inset -2px -2px 4px rgba(0,0,0,0.4),    
                0 4px 0 #000; 
        }
        .dpad-h { width: 120px; height: 36px; top: 42px; left: 0; }
        .dpad-v { width: 36px; height: 120px; left: 42px; top: 0; }
        .dpad-center {
            position: absolute; width: 36px; height: 36px; background-color: #1c1c1c; top: 42px; left: 42px; z-index: 10;
        }
        .dpad-center::after {
            content: ''; position: absolute; top: 5px; left: 5px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle, #000 0%, #1c1c1c 70%); opacity: 0.9;
        }
        .dpad-btn { position: absolute; width: 42px; height: 42px; z-index: 20; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .dpad-up { top: 0; left: 39px; } .dpad-down { bottom: 0; left: 39px; } .dpad-left { top: 39px; left: 0; } .dpad-right { top: 39px; right: 0; }
        .action-buttons {
            position: absolute; top: 70px; right: 30px; width: 140px; height: 70px; transform: rotate(-20deg);
        }
        .btn-round {
            width: 55px; height: 55px; background-color: #1c1c1c; border-radius: 50%; color: #555; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center;
            box-shadow: 
                inset 3px 3px 8px rgba(255,255,255,0.2), 
                inset -3px -3px 8px rgba(0,0,0,0.5), 
                0 6px 0 #000; 
            cursor: pointer; position: absolute; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-round:active, .btn-round.pressed {
            transform: translateY(4px); 
            box-shadow: 
                inset 3px 3px 8px rgba(255,255,255,0.2), 
                inset -3px -3px 8px rgba(0,0,0,0.5), 
                0 2px 0 #000; 
        }
        .btn-b { bottom: 0; left: 0; } .btn-a { top: 0; right: 0; }
        .btn-label {
            position: absolute; bottom: -25px; right: 18px; font-size: 14px; font-weight: bold; color: #7c3aed; transform: rotate(20deg); 
        }
        .meta-buttons {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; 
        }
        .btn-pill {
            width: 65px; height: 16px; background-color: #6b7280; border-radius: 12px; transform: rotate(-25deg);
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.3), 
                inset -2px -2px 5px rgba(0,0,0,0.5),    
                0 4px 0 #4b5563; 
            cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-pill:active, .btn-pill.pressed {
            transform: rotate(-25deg) translateY(2px);
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.3), 
                inset -2px -2px 5px rgba(0,0,0,0.5),
                0 2px 0 #4b5563; 
        }
        .meta-label {
            font-size: 11px; color: #7c3aed; text-align: center; margin-top: 8px; transform: rotate(-25deg); font-weight: bold; letter-spacing: 0.5px; user-select: none;
        }
        /* --- End D-Pad Styles --- */

        /* Overlay Styles */
        .menu-ui, #key-binding-menu, #upload-menu { 
            width: 100%; 
            height: 100%; 
            /* White/Off-white background matching the console shell */
            background-color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 10px; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 100; /* Ensure it is always on top */
            border-radius: 15px; /* Match screen corner rounding */
        }
        #key-binding-menu, #upload-menu { 
            background-color: rgba(248, 250, 252, 0.95); 
            display: none; 
            z-index: 200; 
        }
        .binding-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 300px;
            margin: 8px 0;
            padding: 6px 10px;
            border-radius: 8px;
            background-color: #e5e7eb;
        }
        .binding-key {
            font-weight: 700;
            color: #ef4444; /* Red color for keys */
            padding: 4px 8px;
            border: 1px solid #999;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }
        .active-binding {
            background-color: #fca5a5;
            border-color: #ef4444;
            animation: pulse-red 1s infinite alternate;
        }
        @keyframes pulse-red {
            from { opacity: 0.7; }
            to { opacity: 1.0; }
        }

        /* Styling for the hidden file input */
        #file-input {
            opacity: 0;
            width: 0.1px;
            height: 0.1px;
            position: absolute;
            overflow: hidden;
            z-index: -1;
        }
        .upload-label {
            cursor: pointer;
            padding: 12px 24px;
            background-color: #4f46e5; /* Tailwind indigo-600 */
            color: white;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-label:hover {
            background-color: #4338ca; /* Tailwind indigo-700 */
        }
        .upload-label:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="console-wrapper">
        <div class="gbc-body">
            
            <div class="gbc-screen-lens">
                <div class="lens-branding">
                    <div class="power-led" id="power-led"></div>
                    <div class="text-xs text-zinc-400 font-bold tracking-wider">BATTERY</div>
                </div>
                
                <div class="lcd-screen" id="lcd-screen">
                    <div id="loading-overlay" class="text-white text-center">
                        <svg class="animate-spin h-5 w-5 text-white inline-block mr-2 -mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Loading Game...
                    </div>
                    
                    <!-- The game will be loaded into this iframe -->
                    <iframe id="game-iframe" src="about:blank" allow="keyboard; game" referrerpolicy="no-referrer"></iframe>
                    
                    <!-- Key Binding Menu Overlay -->

    <script type="module">
        // Firebase Imports (required for Canvas environment)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // No Firestore needed for this version, but keeping Firebase init for auth

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        let db, auth;
        let userId = null;

        // Key Mappings (Standard NES/Game Boy mappings)
        let keyMap = {
            'Up': { key: 'w', code: 'KeyW', keyCode: 87 },
            'Down': { key: 's', code: 'KeyS', keyCode: 83 },
            'Left': { key: 'a', code: 'KeyA', keyCode: 65 },
            'Right': { key: 'd', code: 'KeyD', keyCode: 68 },
            'A': { key: 'j', code: 'KeyJ', keyCode: 74 },
            'B': { key: 'k', code: 'KeyK', keyCode: 75 },
            'Start': { key: ' ', code: 'Space', keyCode: 32 },
            'Select': { key: 'e', code: 'KeyE', keyCode: 69 },
        };
        
        const keyMapStorageKey = `emulator-keymap-${appId}`;
        let isBindingMode = false;
        let activeBindingLabel = null;
        let virtualKeyStates = {}; // Track the pressed state of virtual buttons
        let currentMenu = null; // Tracks which menu is open ('keymap', 'upload', or null)

        // --- Initialization and Utility Functions ---

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                
                // Sign in with custom token or anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        loadKeyMap();
                        document.getElementById('power-led').classList.add('on');
                        // Hide loading overlay only after auth completes
                        setTimeout(() => { // Small delay for visual effect
                            document.getElementById('loading-overlay').style.display = 'none';
                        }, 500);
                    } else {
                        userId = null;
                        document.getElementById('power-led').classList.remove('on');
                        document.getElementById('loading-overlay').style.display = 'flex';
                    }
                });
            } catch (error) {
                console.error("Firebase Initialization/Auth Error:", error);
                document.getElementById('loading-overlay').innerHTML = "Failed to load emulator. Check console for details.";
                document.getElementById('power-led').classList.remove('on');
            }
        }

        function loadKeyMap() {
            const storedMap = localStorage.getItem(keyMapStorageKey);
            if (storedMap) {
                try {
                    keyMap = JSON.parse(storedMap);
                } catch (e) {
                    console.error("Failed to parse stored key map:", e);
                }
            }
            renderBindings();
        }

        function saveKeyMap() {
            localStorage.setItem(keyMapStorageKey, JSON.stringify(keyMap));
            renderBindings();
        }

        function generateBindingRow(label) {
            const mappedKey = keyMap[label];
            const displayKey = mappedKey ? (mappedKey.key === ' ' ? 'Space' : mappedKey.key.toUpperCase()) : 'N/A';
            
            return `
                <div class="binding-row">
                    <span class="font-semibold">${label}:</span>
                    <span 
                        class="binding-key binding-target" 
                        data-label="${label}" 
                        id="binding-key-${label}"
                    >
                        ${displayKey}
                    </span>
                </div>
            `;
        }

        function renderBindings() {
            const bindingsList = document.getElementById('bindings-list');
            if (bindingsList) {
                bindingsList.innerHTML = Object.keys(keyMap).map(generateBindingRow).join('');
                
                // Attach click listeners to the new spans
                bindingsList.querySelectorAll('.binding-target').forEach(span => {
                    const label = span.getAttribute('data-label');
                    span.addEventListener('click', () => startKeyBinding(label));
                });
            }
        }

        // --- Key Event Handlers ---

        function handleGlobalKey(e) {
            
            if (currentMenu !== null && e.type === 'keydown') {
                if (e.key === "Escape") {
                    if (currentMenu === 'keymap') toggleKeyBindingMenu();
                    else if (currentMenu === 'upload') toggleUploadMenu();
                    
                    if (isBindingMode) {
                        // Cancel current binding on ESC
                        document.getElementById(`binding-key-${activeBindingLabel}`)?.classList.remove('active-binding');
                        renderBindings(); 
                        activeBindingLabel = null;
                        isBindingMode = false;
                    }
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }
            }
            
            // Check if we are currently in binding mode and a key is pressed (not released)
            if (isBindingMode && e.type === 'keydown') {
                handleBindingKey(e);
                // If binding mode consumed the key press (and activeBindingLabel is now null), we stop here.
                if (activeBindingLabel === null) { 
                    e.preventDefault();
                    return; 
                }
            }
            
            // If in binding mode, suppress keypress
            if (isBindingMode) {
                 e.preventDefault();
                 e.stopPropagation();
                 return;
            }

            // --- Game Input Handling ---
            
            const entry = Object.entries(keyMap).find(([, mappedKey]) => 
                mappedKey.code === e.code || mappedKey.key === e.key
            );

            if (entry) {
                const label = entry[0];
                const isDown = e.type === 'keydown';
                
                e.preventDefault();
                e.stopPropagation();

                // D-Pad arm visual handling 
                if (['Up', 'Down', 'Left', 'Right'].includes(label)) {
                    const dpadArmH = document.querySelector('.dpad-h');
                    const dpadArmV = document.querySelector('.dpad-v');
                    
                    handleVirtualPress(label, isDown, false); // Update state

                    if (isDown) {
                        if (label === 'Left' || label === 'Right') dpadArmH?.classList.add('pressed-arm');
                        if (label === 'Up' || label === 'Down') dpadArmV?.classList.add('pressed-arm');
                    } else {
                        const isHorizontalPressed = virtualKeyStates['Left'] || virtualKeyStates['Right'];
                        const isVerticalPressed = virtualKeyStates['Up'] || virtualKeyStates['Down'];

                        if (!isHorizontalPressed) dpadArmH?.classList.remove('pressed-arm');
                        if (!isVerticalPressed) dpadArmV?.classList.remove('pressed-arm');
                    }
                }
                
                // Send the key message to the iframe
                handleVirtualPress(label, isDown);
            } 
        }

        // --- Visual & Virtual Press Logic ---

        function handleVisualPress(element, isDown) {
            if (element) {
                 if (isDown) {
                    element.classList.add('pressed');
                } else {
                    element.classList.remove('pressed');
                }
            }
        }
        
        function handleVirtualPress(label, isDown, shouldSendMessage = true) {
            const currentState = virtualKeyStates[label] || false;

            if (isDown && !currentState) {
                virtualKeyStates[label] = true;
                if (shouldSendMessage) sendKey(label, true); // Send keydown
            } else if (!isDown && currentState) {
                virtualKeyStates[label] = false;
                if (shouldSendMessage) sendKey(label, false); // Send keyup
            }
        }

        function handlePress(label, isDown, element = null, e = null) {
            
            if (currentMenu !== null) {
                if (e && (e.type === 'touchstart' || e.type === 'mousedown')) {
                    e.preventDefault();
                }
                return; // Ignore control presses if a menu is open
            }
            
            if (e && (e.type === 'touchstart' || e.type === 'mousedown')) {
                e.preventDefault();
            }

            handleVisualPress(element, isDown);
            handleVirtualPress(label, isDown);
        }

        function sendKey(label, isDown) {
            const iframe = document.getElementById('game-iframe');
            if (!iframe || !iframe.contentWindow || currentMenu !== null) return;
            
            const mappedKey = keyMap[label];
            if (!mappedKey) return;

            const eventType = isDown ? 'keydown' : 'keyup';
            
            // Post the message to the iframe
            iframe.contentWindow.postMessage({
                type: eventType,
                key: mappedKey.key,
                code: mappedKey.code,
                keyCode: mappedKey.keyCode
            }, '*');
        }

        // --- Menu Logic ---
        
        function toggleKeyBindingMenu() {
            if (currentMenu === 'upload') return; // Don't open if upload is open
            const menu = document.getElementById('key-binding-menu');
            
            if (currentMenu === 'keymap') {
                currentMenu = null;
                isBindingMode = false;
                menu.style.display = 'none';
            } else {
                currentMenu = 'keymap';
                isBindingMode = true;
                menu.style.display = 'flex';
                renderBindings(); 
            }
            
            // If closing, clear active binding state
            if (!isBindingMode && activeBindingLabel) {
                 document.getElementById(`binding-key-${activeBindingLabel}`)?.classList.remove('active-binding');
                 activeBindingLabel = null;
            }
        }

        function toggleUploadMenu() {
            if (currentMenu === 'keymap') return; // Don't open if keymap is open
            const menu = document.getElementById('upload-menu');

            if (currentMenu === 'upload') {
                currentMenu = null;
                menu.style.display = 'none';
            } else {
                currentMenu = 'upload';
                menu.style.display = 'flex';
            }
        }
        
        // --- File Upload Logic (Integrated from index (4).html concept) ---

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const fileStatus = document.getElementById('file-status');
            const iframe = document.getElementById('game-iframe');

            if (!file) {
                fileStatus.textContent = "No file selected.";
                return;
            }

            if (file.type !== 'text/html' && !file.name.endsWith('.html')) {
                fileStatus.textContent = "Error: Please select a valid HTML file.";
                return;
            }

            fileStatus.textContent = `Loading ${file.name}...`;

            const reader = new FileReader();

            reader.onload = function(e) {
                const htmlContent = e.target.result;
                
                // Use a Blob URL to load the content into the iframe's source.
                // This isolates the content and allows it to run.
                try {
                    const blob = new Blob([htmlContent], { type: 'text/html' });
                    const blobUrl = URL.createObjectURL(blob);
                    iframe.src = blobUrl;
                    
                    // Cleanup old URL object when the iframe loads the new one
                    iframe.onload = () => {
                         // Revoke the old URL after the new content has loaded
                         // This is important for memory management, though hard to track the very first one
                         if (iframe.dataset.blobUrl) {
                            URL.revokeObjectURL(iframe.dataset.blobUrl);
                         }
                         iframe.dataset.blobUrl = blobUrl;
                         fileStatus.textContent = `Game loaded: ${file.name}`;
                         toggleUploadMenu(); // Automatically close the menu on load
                         iframe.onload = null; // Remove temporary onload handler
                    };

                } catch (error) {
                    console.error("Failed to load content into iframe:", error);
                    fileStatus.textContent = `Error loading file: ${file.name}`;
                }
            };

            reader.onerror = function() {
                fileStatus.textContent = "Error reading file.";
            };

            reader.readAsText(file);
        }

        // --- Key Binding Sub-Logic ---
        
        function startKeyBinding(label) {
            if (!isBindingMode) return;

            // Clear previous active binding highlight
            if (activeBindingLabel) {
                document.getElementById(`binding-key-${activeBindingLabel}`)?.classList.remove('active-binding');
            }

            activeBindingLabel = label;
            document.getElementById(`binding-key-${label}`).classList.add('active-binding');
            
            // Display message to the user
            document.getElementById(`binding-key-${label}`).textContent = 'PRESS KEY...';
        }
        
        function handleBindingKey(e) {
            if (!isBindingMode || !activeBindingLabel) return;
            
            e.preventDefault();
            e.stopPropagation();

            // Ignore modifier keys
            if (e.key === "Escape" || e.code.startsWith('Meta') || e.code.startsWith('Control') || e.code.startsWith('Shift') || e.code.startsWith('Alt')) {
                // ESC is handled globally above to close the menu
                return;
            }
            
            // Update the keyMap with the new binding
            keyMap[activeBindingLabel] = {
                key: e.key.toLowerCase(), 
                code: e.code,
                keyCode: e.keyCode
            };
            
            // Save and update UI
            saveKeyMap(); 
            document.getElementById(`binding-key-${activeBindingLabel}`)?.classList.remove('active-binding');
            activeBindingLabel = null;
            isBindingMode = false; // Binding complete, exit binding mode
        }

        // --- Event Listeners and Setup ---

        function setupControlListeners() {
            // Include virtual controls (D-pad targets, A/B/Start/Select)
            const controls = document.querySelectorAll('.dpad-btn, .btn-round, .btn-pill');
            
            controls.forEach(control => {
                const label = control.getAttribute('data-label');
                
                // MOUSE Events
                control.addEventListener('mousedown', (e) => handlePress(label, true, control, e));
                control.addEventListener('mouseup', (e) => handlePress(label, false, control, e));
                control.addEventListener('mouseleave', (e) => handlePress(label, false, control, e));
                
                // TOUCH Events
                control.addEventListener('touchstart', (e) => {
                    e.preventDefault(); 
                    handlePress(label, true, control, e);
                }, { passive: false });
                control.addEventListener('touchend', (e) => handlePress(label, false, control, e));
                control.addEventListener('touchcancel', (e) => handlePress(label, false, control, e));
            });
            
            // Menu Controls 
            document.getElementById('btn-key-map-menu')?.addEventListener('click', toggleKeyBindingMenu);
            document.getElementById('btn-close-key-map')?.addEventListener('click', toggleKeyBindingMenu);
            
            document.getElementById('btn-load-rom-menu')?.addEventListener('click', toggleUploadMenu);
            document.getElementById('btn-close-upload')?.addEventListener('click', toggleUploadMenu);
            
            // File Input Listener
            document.getElementById('file-input')?.addEventListener('change', handleFileUpload);
            
            // Global keydown/keyup listeners for actual keyboard input
            window.addEventListener('keydown', handleGlobalKey);
            window.addEventListener('keyup', handleGlobalKey);
        }

        // --- Initial Setup and Scaling Logic ---
        window.onload = function() {
            // Initialize Firebase and Auth once the document is fully loaded
            initFirebase();
            setupControlListeners();
        };

        /**
         * Calculates the scale factor to make the fixed-size console fit the current viewport.
         */
        function scaleConsole() {
            const wrapper = document.getElementById('console-wrapper');
            if (!wrapper) return;
            
            const consoleWidth = 440; 
            const consoleHeight = 760; 
            
            // Buffer space (reduced from 50px to 20px) to maximize size while ensuring no scrollbars appear.
            const safeBuffer = 20; 
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const requiredWidth = consoleWidth + safeBuffer;
            const requiredHeight = consoleHeight + safeBuffer;
            
            let scaleX = windowWidth / requiredWidth;
            let scaleY = windowHeight / requiredHeight;
            
            // Use the smaller scale factor to ensure it fits both dimensions
            // Clamp at 1 to prevent enlarging the console beyond its original size on very large screens
            const scale = Math.min(1, scaleX, scaleY);
            
            // Apply scale
            wrapper.style.transform = `scale(${scale})`;
        }

        // Recalculate scale on window resize and orientation change
        window.addEventListener('resize', scaleConsole);
        window.addEventListener('orientationchange', scaleConsole);
        
        // Execute immediately to set the correct scale right away
        scaleConsole();
    </script>
</body>
